<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Votación</title>
  <link rel="stylesheet" href="./index.css">
  <link rel="shortcut icon" href="./Imagenes/gota.webp" type="image/x-icon">
</head>
<body>

<div class="container">
  
  <!-- Paso 1: Datos Personales -->
  <section id="step-register" class="card">
    <h2>Registro del Elector <br> <br> Votación del Cuadro Conmemorativo del 13° Aniversario del Ven 9-1-1</h2>
    <form id="voter-form">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" required placeholder="Ej: Juan">
      </div>
      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" required placeholder="Ej: Pérez">
      </div>
      <div class="form-group">
        <label for="cedula">Cédula de Identidad</label>
        <input type="text" id="cedula" required placeholder="Ej: V-12345678">
      </div>
      <div class="form-group">
        <label for="coordinacion">Coordinación / Departamento</label>
        <input type="text" id="coordinacion" required placeholder="Ej: Gestión Comunicacional">
      </div>
      <button type="submit" class="btn">Continuar a la Votación</button>
    </form>
  </section>

  <!-- Paso 2: Elección de Imágenes (26 opciones) -->
  <section id="step-vote" class="card hidden">
    <h2>Selecciona una Opción</h2>
    <p class="subtitle">Desplaza la lista, usa "🔍 Zoom" para ver en detalle y haz clic sobre la imagen para elegirla.</p>
    
    <div class="gallery" id="gallery-container">
      <!-- Se inyectan dinámicamente con JS -->
    </div>

    <button id="submit-vote-btn" class="btn" disabled>Confirmar y Enviar Voto</button>
  </section>

  <!-- Paso 3: Confirmación Final -->
  <section id="step-success" class="card hidden" style="text-align: center;">
    <div class="alert alert-success">
      <h3>¡Voto registrado con éxito!</h3>
      <p style="margin-top: 8px;">Tu elección ha quedado registrada en la hoja de cálculo.</p>
    </div>
  </section>

</div>

<!-- Modal de Zoom -->
<div id="zoom-modal" class="modal" onclick="closeZoom()">
  <span class="modal-close">&times;</span>
  <img id="modal-img" src="" alt="Vista ampliada">
</div>
<script src="./index.js"></script>
</body>
</html>
